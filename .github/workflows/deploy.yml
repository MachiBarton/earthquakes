name: Update data and deploy

on:
  schedule:
    # 每日北京时间 06:17（UTC 22:17）收集数据并重新构建发布；GitHub 高峰期可能延迟触发。
    - cron: '17 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect all data snapshots
        run: npm run update:data

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- public/data; then
            git add public/data
            git commit -m "chore(data): scheduled snapshot update $(date -u +%Y-%m-%d)"
            # 并发或排队的运行可能已先推送快照提交（后启动者的 checkout 停在触发时旧提交）：
            # push 被拒时 rebase 到 origin/main 重试一次；仍失败只告警，不阻塞本次部署
            # （本次收集的数据已包含在本次构建产物中）。
            if ! git push; then
              echo "::warning::Snapshot push rejected; rebasing onto origin/main and retrying"
              git pull --rebase origin main && git push
            fi || echo "::warning::Snapshot commit push failed (a concurrent run won); deploying with this run's data anyway."
          else
            echo "No snapshot changes; skip commit."
          fi

      - name: Quality gates
        run: |
          npm run lint
          npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
